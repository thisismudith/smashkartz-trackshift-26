# TrackShift 2026 event rule configuration (M18, CP-03).
#
# Every regulatory value is UNVERIFIED until traced to an FIA article and
# recorded in its source field (AGENTS.md sections 20.1, 21, 57). Values here
# are usable for modelling immediately; they simply may not back a claim that
# the system is legal by construction.
#
# value_source tiers:
#   RULE_FIA             cited to a Sporting/Technical Regulation or event note
#   OBSERVED_RCM         derived from race-control messages in the raw mirror
#   DERIVED_TELEMETRY    measured from the telemetry itself
#   PROXY_HISTORICAL_DRS inferred from 2022-2025 DRS activity; development only
#   UNVERIFIED           not yet sourced

schema_version: 1
event: spanish_grand_prix
event_display: "Spanish Grand Prix"
circuit: spanish
year: 2026

# NOTE: this event is incomplete in the mirror and is excluded from the
# CP-03 14-event set. Sessions present: ['Practice 1'].
complete_in_mirror: false

lap_length_m:
  value: 5325.9
  value_source: DERIVED_TELEMETRY
  source: "median max(distance) over 30 sampled Practice 1 laps, lap 1 excluded"
  published_circuit_length_m: 5474
  delta_vs_published_m: -148.1
  delta_vs_published_pct: -2.71
  note: >-
    Telemetry distance is integrated along the path the car actually drove, so it
    reads shorter than the homologated circuit length: straight-line integration
    between samples undershoots the arc through a corner. The shortfall tracks
    corner density, from -0.61% at Monza to -2.58% at the Hungaroring.
    USE THE MEASURED VALUE. CP-05 segments on telemetry distance, so segment
    boundaries must live in the same coordinate system; the published figure is a
    sanity cross-check only, and is not interchangeable with it.

geometry:
  corner_count: 0
  rotation_deg: null
  value_source: OBSERVED
  source: "TODO: corners.json not present"
  corner_distances_m: []

overtake:
  enabled: true
  # Race control states WHETHER Overtake is available, never WHERE. Line
  # positions are not derivable from rcm.json and stay UNVERIFIED until an
  # FIA event note is found, or PROXY_HISTORICAL_DRS from derive_drs_zones.py.
  zones:
    - zone: 1
      name: "TODO"
      detection_line_m:
        value: null
        value_source: UNVERIFIED
        source: "TODO: FIA event notes 2026 Spanish Grand Prix"
      activation_line_m:
        value: null
        value_source: UNVERIFIED
        source: "TODO: FIA event notes 2026 Spanish Grand Prix"

race_control:
  overtake_windows_source: "artifacts/race_control/2026_spanish_grand_prix.json"
  value_source: OBSERVED_RCM
  source: "race-control messages in the raw mirror, extracted by scripts/data/extract_race_control.py"
  overtake_enabled_messages: 0
  overtake_disabled_messages: 0

# Season-wide values (power envelope, energy budgets, detection gap) live in
# common.yaml. Add a key here only to override the season value for this
# event, and only with a cited source.
overrides: {}
