# TrackShift 2026 event rule configuration (M18, CP-03).
#
# Every regulatory value is UNVERIFIED until traced to an FIA article and
# recorded in its source field (AGENTS.md sections 20.1, 21, 57). Values here
# are usable for modelling immediately; they simply may not back a claim that
# the system is legal by construction.
#
# value_source tiers:
#   RULE_FIA             cited to a Sporting/Technical Regulation or event note
#   OBSERVED_RCM         derived from race-control messages in the raw mirror
#   DERIVED_TELEMETRY    measured from the telemetry itself
#   PROXY_HISTORICAL_DRS inferred from 2022-2025 DRS activity; development only
#   UNVERIFIED           not yet sourced

schema_version: 1
event: austrian_grand_prix
event_display: "Austrian Grand Prix"
circuit: austrian
year: 2026

complete_in_mirror: true

lap_length_m:
  value: 4277.7
  value_source: DERIVED_TELEMETRY
  source: "median max(distance) over 30 sampled Race laps, lap 1 excluded"
  published_circuit_length_m: 4318
  delta_vs_published_m: -40.3
  delta_vs_published_pct: -0.93
  note: >-
    Telemetry distance is integrated along the path the car actually drove, so it
    reads shorter than the homologated circuit length: straight-line integration
    between samples undershoots the arc through a corner. The shortfall tracks
    corner density, from -0.61% at Monza to -2.58% at the Hungaroring.
    USE THE MEASURED VALUE. CP-05 segments on telemetry distance, so segment
    boundaries must live in the same coordinate system; the published figure is a
    sanity cross-check only, and is not interchangeable with it.

geometry:
  corner_count: 10
  rotation_deg: 1.0
  value_source: OBSERVED
  source: "data/raw/tracinginsights/2026/Austrian Grand Prix/Race/corners.json"
  corner_distances_m: [256.7, 906.9, 1196.9, 2010.4, 2198.3, 2517.8, 2838.7, 3041.1, 3578.4, 3778.2]

overtake:
  enabled: true
  tier_c_proxy_exclusions:
    - candidate_m: [0.0, 300.0]
      reason: "historical DRS candidate crosses CP-05 brake-onset boundary at 160.0 m"
    - candidate_m: [500.0, 1200.0]
      reason: "historical DRS candidate crosses CP-05 brake-onset boundary at 1080.0 m"
    - candidate_m: [1500.0, 2000.0]
      reason: "historical DRS candidate crosses CP-05 brake-onset boundary at 1880.0 m"
  # Race control states WHETHER Overtake is available, never WHERE. Line
  # positions are not derivable from rcm.json and stay UNVERIFIED until an
  # FIA event note is found, or PROXY_HISTORICAL_DRS from derive_drs_zones.py.
  # One Detection Line per lap, at Safety Car Line 1 (the pit-entry bollard).
  # Shared by every zone below; a zone-level detection_line_m would override it.
  detection_line_m:
    value: 4010.0
    value_source: DERIVED_TELEMETRY
    source: "FIA 2026 Race Director's Competition Notes: \"The detection line referred to in Article B 7.2.1 of the FIA F1 Regulations, is at the same location of the Safety Car Line 1.\" Stated verbatim in the Belgian, Chinese and Hungarian notes. Item 14.3 of the same notes places Safety Car Line 1 at the pit-entry bollard: \"any driver passing to the right-hand side of the bollard at safety car line 1 will be considered as entering the pit lane.\" Pit entry measured in telemetry distance as the row where lap_start_session_s + lap_elapsed_s is closest to pit_in_session_s, over 40 Race and Sprint in-lap(s) of the 2026 lake; median 4010 m, interquartile range 4000-4020 m (20 m, one 20 m resample bin). Evidence and method in artifacts/detection_lines/harvest_2026.json."
    note: "One Detection Line per lap, shared by every zone: the 2026 notes describe it in the singular at a single location, unlike DRS per-zone detection. The rule is Tier A; this value is the measured position of that rule's location, so it is DERIVED_TELEMETRY rather than RULE_FIA. This event's own notes are silent on the detection line; the wording is identical across the three events that do state it, which is why it is applied here, but it is not separately confirmed for this circuit."
  zones:
    - zone: 1
      name: "TODO"
      detection_line_m:
        value: null
        value_source: UNVERIFIED
        source: "No Detection Line is configured: artifacts/drs_zones/austrian_grand_prix.json candidates overlap CP-05 brake-onset boundaries, and scripts/data/derive_drs_zones.py never derives Detection Lines."
        note: "Retained null: no heuristic Detection-Line fallback is permitted."
      activation_line_m:
        value: null
        value_source: UNVERIFIED
        source: "No Activation proxy accepted: every historical DRS candidate overlaps a CP-05 brake-onset boundary; no FIA 2026 line source is configured."
        note: "Retained null pending FIA line documentation or a non-overlapping documented derivation."

race_control:
  overtake_windows_source: "artifacts/race_control/2026_austrian_grand_prix.json"
  value_source: OBSERVED_RCM
  source: "race-control messages in the raw mirror, extracted by scripts/data/extract_race_control.py"
  overtake_enabled_messages: 1
  overtake_disabled_messages: 1

# Season-wide values (power envelope, energy budgets, detection gap) live in
# common.yaml. Add a key here only to override the season value for this
# event, and only with a cited source.
overrides: {}
