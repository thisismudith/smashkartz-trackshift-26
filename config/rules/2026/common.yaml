# TrackShift 2026 season-wide rule configuration (M18, CP-03).
#
# Values here apply to every 2026 event unless an event file overrides them in
# its `overrides:` block. Regulations are external inputs, never learned
# parameters (AGENTS.md section 21).
#
# ---------------------------------------------------------------------------
# PROVENANCE TIERS -- every value carries one, and the tier governs what may be
# claimed from it (sections 57, 58).
#
#   RULE_FIA              Cited to an FIA Sporting/Technical Regulation article
#                         or an event note. Usable for anything, including a
#                         "legal by construction" claim.
#   OBSERVED_RCM          Derived from race-control messages in the raw mirror.
#                         Genuinely observed; covers whether Overtake was
#                         available, never where the lines are.
#   DERIVED_TELEMETRY     Measured from the telemetry itself.
#   PROXY_HISTORICAL_DRS  Inferred from 2022-2025 DRS activity at the same
#                         circuit. Development and DP shape only. NEVER a demo
#                         claim: historical DRS is not 2026 Overtake (section 41).
#   UNVERIFIED            Not yet sourced. Usable for modelling; blocks claims.
#
# The rule engine (CP-11) refuses to start when strict_mode is true and any
# consumed value is UNVERIFIED or PROXY_*.
# ---------------------------------------------------------------------------
#
# UNITS. Power in kW. Stored and per-lap energy in MJ, matching how the
# regulations state it. Per-segment energy deltas elsewhere stay in kJ. The unit
# is always in the field name (section 11).

schema_version: 1
season: 2026

regulation_snapshot:
  section_issues:
    section_b_sporting: 8
    section_c_technical: 20
  publication_dates:
    section_b_sporting: 2026-08-05
    section_c_technical: 2026-08-05
  effective_date: 2026-08-05
  source_documents:
    - document: FIA 2026 F1 Regulations - Section B Sporting - Issue 08
      article: B7.2.1, B7.2.2, B7.2.3
      pages: [62, 63, 64]
      url: https://www.fia.com/system/files/documents/fia_2026_f1_regulations_-_section_b_sporting_-_iss_08_-_2026-08-05_7.pdf
      interpretation: Overtake enablement, Detection Gap/Line and Activation Line are competition inputs; race control can disable Overtake.
      confidence: HIGH
    - document: FIA 2026 F1 Regulations - Section C Technical - Issue 20
      article: C5.2.7, C5.2.8, C5.2.9, C5.2.10
      pages: [63, 64]
      url: https://www.fia.com/system/files/documents/fia_2026_f1_regulations_-_section_c_technical_-_iss_20_-_2026-08-05.pdf
      interpretation: Absolute ERS-K power, speed-dependent deployment curves, ES SOC excursion, and Recharge limits.
      confidence: HIGH
  retrieved_at: 2026-09-13
  encoded_configuration_version: rules-2026-common-v2-fia-iss08-iss20
  note: >-
    The published regulation, applicable competition configuration and this
    encoding are kept separately auditable (section 6). Final mode additionally
    requires every consumed value to be resolved and sourced.

overtake:
  detection_gap_s:
    value: 1.0
    value_source: UNVERIFIED
    source: "UNRESOLVED: FIA Section B Sporting Issue 08, Article B7.2.1b(vii), https://www.fia.com/system/files/documents/fia_2026_f1_regulations_-_section_b_sporting_-_iss_08_-_2026-08-05_7.pdf; the public regulation requires a competition-provided Detection Gap but does not state its event value here"
    note: >-
      Gap threshold at the Detection Line for Overtake to arm. 1.0 s is the
      long-standing DRS threshold and is a plausible starting point, but it is a
      carried-over assumption, not a 2026 citation.

# Maximum electrical deployment is a FUNCTION OF SPEED, not a constant
# (section 20.1). Piecewise linear between breakpoints, clamped outside the
# range. The rule engine owns the only evaluator:
# max_electrical_power_kw(speed_kmh, mode, event_rules).
#
# These three curves matter more than almost any other value here, because the
# DP's entire action space is built on them: deploy_level is a fraction of the
# cap at the current speed, not of a fixed 350 kW.
power_envelope:
  normal:
    breakpoints_kmh: [0, 290, 340, 345]
    max_power_kw: [350, 350, 100, 0]
    value_source: RULE_FIA
    source: "FIA Section C Technical Issue 20, Article C5.2.7 and C5.2.8i, pp. 63-64, https://www.fia.com/system/files/documents/fia_2026_f1_regulations_-_section_c_technical_-_iss_20_-_2026-08-05.pdf"
    note: "The 350 kW absolute cap applies below 290 km/h; above it the Article C5.2.8i formula is 1800 - 5*speed below 340 km/h, then 6900 - 20*speed below 345 km/h, then zero."
  override:
    breakpoints_kmh: [0, 337.5, 355]
    max_power_kw: [350, 350, 0]
    value_source: RULE_FIA
    source: "FIA Section C Technical Issue 20, Article C5.2.7 and C5.2.8ii, p. 63, https://www.fia.com/system/files/documents/fia_2026_f1_regulations_-_section_c_technical_-_iss_20_-_2026-08-05.pdf"
    note: "The 350 kW absolute cap intersects 7100 - 20*speed at 337.5 km/h; the Overtake-active curve reaches zero at 355 km/h."
  separation_speed_kmh:
    value: 290
    value_source: RULE_FIA
    source: "Calculated from the 350 kW absolute cap in FIA Section C Technical Issue 20 Article C5.2.7 and the non-Overtake formula in Article C5.2.8i, p. 63, https://www.fia.com/system/files/documents/fia_2026_f1_regulations_-_section_c_technical_-_iss_20_-_2026-08-05.pdf"
    note: >-
      Below this the curves coincide, so override confers no power advantage and
      the mode is not observable. The M35 discriminator must return UNKNOWN
      below it rather than NORMAL (section 20.2).
  competition_adjustments: []

energy:
  deploy_limit_per_lap_mj:
    value: null
    value_source: UNVERIFIED
    source: "UNRESOLVED: FIA Section C Technical Issue 20 Articles C5.2.7-C5.2.10 specify instantaneous power, ES SOC excursion and Recharge limits, not a generic per-lap deployment budget; no substitute may be invented"
  harvest_limit_per_lap_mj:
    value: 8.5
    value_source: RULE_FIA
    source: "FIA Section C Technical Issue 20 Article C5.2.10, p. 63, https://www.fia.com/system/files/documents/fia_2026_f1_regulations_-_section_c_technical_-_iss_20_-_2026-08-05.pdf"
    note: "Base Recharge limit. Article C5.2.10 and Sporting Article B7.2.1 allow competition-specific reductions/additional conditions; the event-specific value remains a required final input."
  store_capacity_mj:
    value: null
    value_source: UNVERIFIED
    source: "UNRESOLVED: FIA Section C Technical Issue 20 Article C5.2.9, p. 63, https://www.fia.com/system/files/documents/fia_2026_f1_regulations_-_section_c_technical_-_iss_20_-_2026-08-05.pdf; the rule gives a 4MJ maximum SOC excursion, not the physical ES capacity"
    note: >-
      The physical bound on ers_soc_est_mj, a different constraint from the
      per-lap flow limits above. A car can be short of deploy budget with a full
      store, or the reverse; conflating them produces a twin that is right about
      total energy and wrong about what the car may legally do next (section 28).
  accounting_window: lap

race_control:
  overtake_disabled_conditions:
    value: ["SAFETY_CAR", "VIRTUAL_SAFETY_CAR", "RED_FLAG", "WET_DECLARED"]
    value_source: OBSERVED_RCM
    source: "artifacts/race_control/2026_*.json, generated by scripts/data/extract_race_control.py"
    note: >-
      Observed in the 2026 message feed: 51 OVERTAKE ENABLED and 23 OVERTAKE
      DISABLED messages across the season, alongside 11 Safety Car and 31 VSC
      deployments. The list is the observed association, not a cited regulation.

# Set true before any demo claim. The rule engine then refuses to run against
# UNVERIFIED or PROXY_* values, so a claim cannot rest on an unsourced number.
strict_mode: false
