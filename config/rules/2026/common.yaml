# TrackShift 2026 season-wide rule configuration (M18, CP-03).
#
# Values here apply to every 2026 event unless an event file overrides them in
# its `overrides:` block. Regulations are external inputs, never learned
# parameters (AGENTS.md section 21).
#
# ---------------------------------------------------------------------------
# PROVENANCE TIERS -- every value carries one, and the tier governs what may be
# claimed from it (sections 57, 58).
#
#   RULE_FIA              Cited to an FIA Sporting/Technical Regulation article
#                         or an event note. Usable for anything, including a
#                         "legal by construction" claim.
#   OBSERVED_RCM          Derived from race-control messages in the raw mirror.
#                         Genuinely observed; covers whether Overtake was
#                         available, never where the lines are.
#   DERIVED_TELEMETRY     Measured from the telemetry itself.
#   PROXY_HISTORICAL_DRS  Inferred from 2022-2025 DRS activity at the same
#                         circuit. Development and DP shape only. NEVER a demo
#                         claim: historical DRS is not 2026 Overtake (section 41).
#   UNVERIFIED            Not yet sourced. Usable for modelling; blocks claims.
#
# The rule engine (CP-11) refuses to start when strict_mode is true and any
# consumed value is UNVERIFIED or PROXY_*.
# ---------------------------------------------------------------------------
#
# UNITS. Power in kW. Stored and per-lap energy in MJ, matching how the
# regulations state it. Per-segment energy deltas elsewhere stay in kJ. The unit
# is always in the field name (section 11).

schema_version: 1
season: 2026

regulation_snapshot:
  section_issues: []
  publication_dates: []
  effective_date: null
  source_documents: []
  retrieved_at: null
  encoded_configuration_version: rules-2026-common-v1
  note: >-
    Populate when the FIA documents are obtained. Keep the published regulation,
    the applicable competition configuration and this encoding separately
    auditable (section 6).

overtake:
  detection_gap_s:
    value: 1.0
    value_source: UNVERIFIED
    source: "TODO: FIA 2026 Sporting Regulations, Overtake article"
    note: >-
      Gap threshold at the Detection Line for Overtake to arm. 1.0 s is the
      long-standing DRS threshold and is a plausible starting point, but it is a
      carried-over assumption, not a 2026 citation.

# Maximum electrical deployment is a FUNCTION OF SPEED, not a constant
# (section 20.1). Piecewise linear between breakpoints, clamped outside the
# range. The rule engine owns the only evaluator:
# max_electrical_power_kw(speed_kmh, mode, event_rules).
#
# These three curves matter more than almost any other value here, because the
# DP's entire action space is built on them: deploy_level is a fraction of the
# cap at the current speed, not of a fixed 350 kW.
power_envelope:
  normal:
    breakpoints_kmh: [0, 290, 340]
    max_power_kw: [350, 350, 0]
    value_source: UNVERIFIED
    source: "TODO: FIA 2026 Technical Regulations, MGU-K deployment vs speed"
    note: "Reported shape: full power to ~290 km/h, tapering to zero by ~340 km/h."
  override:
    breakpoints_kmh: [0, 337, 355]
    max_power_kw: [350, 350, 0]
    value_source: UNVERIFIED
    source: "TODO: FIA 2026 Sporting/Technical Regulations, Overtake override"
    note: "Reported shape: ~350 kW to ~337 km/h, available to ~355 km/h."
  separation_speed_kmh:
    value: 290
    value_source: UNVERIFIED
    source: "derived from the two curves above; not independently sourced"
    note: >-
      Below this the curves coincide, so override confers no power advantage and
      the mode is not observable. The M35 discriminator must return UNKNOWN
      below it rather than NORMAL (section 20.2).
  competition_adjustments: []

energy:
  deploy_limit_per_lap_mj:
    value: null
    value_source: UNVERIFIED
    source: "TODO: FIA 2026 Technical Regulations, energy flow limits"
  harvest_limit_per_lap_mj:
    value: null
    value_source: UNVERIFIED
    source: "TODO: FIA 2026 Technical Regulations, recovery limits"
  store_capacity_mj:
    value: null
    value_source: UNVERIFIED
    source: "TODO: FIA 2026 Technical Regulations, Energy Store capacity"
    note: >-
      The physical bound on ers_soc_est_mj, a different constraint from the
      per-lap flow limits above. A car can be short of deploy budget with a full
      store, or the reverse; conflating them produces a twin that is right about
      total energy and wrong about what the car may legally do next (section 28).
  accounting_window: lap

race_control:
  overtake_disabled_conditions:
    value: ["SAFETY_CAR", "VIRTUAL_SAFETY_CAR", "RED_FLAG", "WET_DECLARED"]
    value_source: OBSERVED_RCM
    source: "artifacts/race_control/2026_*.json, generated by scripts/data/extract_race_control.py"
    note: >-
      Observed in the 2026 message feed: 51 OVERTAKE ENABLED and 23 OVERTAKE
      DISABLED messages across the season, alongside 11 Safety Car and 31 VSC
      deployments. The list is the observed association, not a cited regulation.

# Set true before any demo claim. The rule engine then refuses to run against
# UNVERIFIED or PROXY_* values, so a claim cannot rest on an unsourced number.
strict_mode: false
