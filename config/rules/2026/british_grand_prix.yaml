      name: "Overtake A1"
      detection_line_m:
        value: 5789.3
        value_source: DERIVED_TELEMETRY
        source: "Aligned to official FIA 2026 British Grand Prix circuit map, Document 6, p. 2, OVERTAKE DETECTION 115m after T18, https://www.fia.com/system/files/decision-document/2026_british_grand_prix_-_competition_notes_-_circuit_map_pit_lane_drawing_emergency_exits_map_and_red_zone.pdf; T18 observed corner distance 5674.3m from geometry.corner_distances_m"
        landmark: "115m after T18"
      activation_line_m:
        value: 5739.3
        value_source: DERIVED_TELEMETRY
        source: "Aligned to official FIA 2026 British Grand Prix circuit map, Document 6, p. 2, OVERTAKE ACTIVATION 65m after T18, https://www.fia.com/system/files/decision-document/2026_british_grand_prix_-_competition_notes_-_circuit_map_pit_lane_drawing_emergency_exits_map_and_red_zone.pdf; T18 observed corner distance 5674.3m from geometry.corner_distances_m"
        landmark: "65m after T18"
      zone_end_m:
        value: null
        value_source: UNVERIFIED
        source: "UNRESOLVED: official FIA 2026 British Grand Prix circuit map identifies the Overtake Activation Line but does not publish an Overtake zone-end line"

