# TrackShift 2026 event rule configuration (M18, CP-03).
#
# Every regulatory value is UNVERIFIED until traced to an FIA article and
# recorded in its source field (AGENTS.md sections 20.1, 21, 57). Values here
# are usable for modelling immediately; they simply may not back a claim that
# the system is legal by construction.
#
# value_source tiers:
#   RULE_FIA             cited to a Sporting/Technical Regulation or event note
#   OBSERVED_RCM         derived from race-control messages in the raw mirror
#   DERIVED_TELEMETRY    measured from the telemetry itself
#   PROXY_HISTORICAL_DRS inferred from 2022-2025 DRS activity; development only
#   UNVERIFIED           not yet sourced

schema_version: 1
event: chinese_grand_prix
event_display: "Chinese Grand Prix"
circuit: chinese
year: 2026

complete_in_mirror: true

lap_length_m:
  value: 5410.2
  value_source: DERIVED_TELEMETRY
  source: "median max(distance) over 24 sampled Race laps, lap 1 excluded"
  published_circuit_length_m: 5451
  delta_vs_published_m: -40.8
  delta_vs_published_pct: -0.75
  note: >-
    Telemetry distance is integrated along the path the car actually drove, so it
    reads shorter than the homologated circuit length: straight-line integration
    between samples undershoots the arc through a corner. The shortfall tracks
    corner density, from -0.61% at Monza to -2.58% at the Hungaroring.
    USE THE MEASURED VALUE. CP-05 segments on telemetry distance, so segment
    boundaries must live in the same coordinate system; the published figure is a
    sanity cross-check only, and is not interchangeable with it.

geometry:
  corner_count: 16
  rotation_deg: 237.0
  value_source: OBSERVED
  source: "data/raw/tracinginsights/2026/Chinese Grand Prix/Race/corners.json"
  corner_distances_m: [591.6, 769.4, 939.2, 1032.0, 1357.4, 1599.2, 2065.6, 2361.5, 2531.6, 2652.9, 3121.7, 3198.4, 3382.6, 4758.4, 4846.2, 5129.5]

overtake:
  enabled: true
  # Race control states WHETHER Overtake is available, never WHERE. Line
  # positions are not derivable from rcm.json and stay UNVERIFIED until an
  # FIA event note is found, or PROXY_HISTORICAL_DRS from derive_drs_zones.py.
  # One Detection Line per lap, at Safety Car Line 1 (the pit-entry bollard).
  # Shared by every zone below; a zone-level detection_line_m would override it.
  detection_line_m:
    value: 5400.0
    value_source: DERIVED_TELEMETRY
    source: "FIA 2026 Race Director's Competition Notes: \"The detection line referred to in Article B 7.2.1 of the FIA F1 Regulations, is at the same location of the Safety Car Line 1.\" Stated verbatim in the Belgian, Chinese and Hungarian notes. Item 14.3 of the same notes places Safety Car Line 1 at the pit-entry bollard: \"any driver passing to the right-hand side of the bollard at safety car line 1 will be considered as entering the pit lane.\" Pit entry measured in telemetry distance as the row where lap_start_session_s + lap_elapsed_s is closest to pit_in_session_s, over 33 Race and Sprint in-lap(s) of the 2026 lake; median 5400 m, interquartile range 5380-5420 m (40 m, wider than one bin). Evidence and method in artifacts/detection_lines/harvest_2026.json."
    note: "One Detection Line per lap, shared by every zone: the 2026 notes describe it in the singular at a single location, unlike DRS per-zone detection. The rule is Tier A; this value is the measured position of that rule's location, so it is DERIVED_TELEMETRY rather than RULE_FIA."
  zones:
    - zone: 1
      name: "TODO"
      detection_line_m:
        value: null
        value_source: UNVERIFIED
        source: "No Detection Line is configured: artifacts/drs_zones/chinese_grand_prix.json has no cross-year historical DRS consensus zone, and scripts/data/derive_drs_zones.py never derives Detection Lines."
        note: "Retained null: no heuristic Detection-Line fallback is permitted."
      activation_line_m:
        value: null
        value_source: UNVERIFIED
        source: "No Activation proxy accepted: artifacts/drs_zones/chinese_grand_prix.json has no cross-year historical DRS consensus zone; no FIA 2026 line source is configured."
        note: "Retained null pending FIA line documentation."

race_control:
  overtake_windows_source: "artifacts/race_control/2026_chinese_grand_prix.json"
  value_source: OBSERVED_RCM
  source: "race-control messages in the raw mirror, extracted by scripts/data/extract_race_control.py"
  overtake_enabled_messages: 4
  overtake_disabled_messages: 2

# Season-wide values (power envelope, energy budgets, detection gap) live in
# common.yaml. Add a key here only to override the season value for this
# event, and only with a cited source.
overrides: {}
