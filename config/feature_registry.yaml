# TrackShift feature registry (M31, AGENTS.md sections 11, 44, 46).
#
# The single namespace for every column any TrackShift dataset produces. A
# builder that writes an unregistered column fails its build (see
# assert_registered in src/trackshift/data/registry.py) -- registration is a
# gate, not documentation written afterwards.
#
# Seeded from the real 48-column telemetry_20m Parquet, not from an aspirational
# list, because the failure mode this registry exists to prevent is drift
# between what is registered and what is actually written.
#
# Required keys on every entry (AGENTS.md section 46 plus the MODELS.md update):
#   name, definition, unit, source, derivation, allowed_sessions,
#   supported_years, live_safe, provenance, availability_scope, source_gated,
#   decision_checkpoint, uncertainty_field, causal_status, counterfactual_safe,
#   regulation_version, regulation_source, interaction_group, consuming_models
#
# Field meanings that are easy to get wrong:
#   live_safe          available at or before the prediction timestamp (section 44).
#                      null only when availability_scope is none.
#   availability_scope all | partial | none. "none" means the channel is not
#                      obtainable today and must never be zero-filled.
#   source_gated       true when the channel waits on a documented continuous
#                      source (section 11).
#   causal_status      CAUSAL uses only information at or before the row.
#                      ACAUSAL uses future information: labels and evaluation only.
#   counterfactual_safe true when the value stays valid under a policy that was
#                      not the one actually driven. Anything observed is false.

schema_version: 1

# Defaults for the C8/M06 pairwise-table columns added in CP-04.  Individual
# entries override availability/provenance when the public C2/C5 contract is
# not yet materialised.  YAML merges keep this generated-table schema readable
# without weakening the required-key registry gate.
pairwise_feature_defaults: &pairwise_feature_defaults
  source: C8 battle rows and contemporaneous C1 segment rows
  derivation: scripts/features/build_pairwise_features.py
  allowed_sessions: [Sprint, Race]
  supported_years: [2022, 2023, 2024, 2025, 2026]
  live_safe: true
  provenance: DERIVED
  availability_scope: all
  source_gated: false
  decision_checkpoint: null
  uncertainty_field: null
  causal_status: CAUSAL
  counterfactual_safe: false
  regulation_version: null
  regulation_source: null
  interaction_group: [pairwise]
  consuming_models: [M06, M08]

