  # ---------------------------------------------------------------- M06 C8 pairwise live features
  - <<: *pairwise_feature_defaults
    name: battle_id
    definition: Stable directed C8 battle identifier.
    unit: null
    provenance: DERIVED
    interaction_group: [key]
    consuming_models: [M06, M08, M09]

  - <<: *pairwise_feature_defaults
    name: segment_index
    definition: One-based chronological index within a C8 battle.
    unit: null
    provenance: DERIVED
    interaction_group: [key]
    consuming_models: [M06, M08, M09]

  - <<: *pairwise_feature_defaults
    name: attacker
    definition: C8 car behind in the directed immediate-ahead relation.
    unit: null
    provenance: DERIVED
    interaction_group: [identity]

  - <<: *pairwise_feature_defaults
    name: defender
    definition: C8 immediate car ahead in the directed relation.
    unit: null
    provenance: DERIVED
    interaction_group: [identity]

  - <<: *pairwise_feature_defaults
    name: time_gap_entry_s
    definition: Attacker-to-ahead entry time gap; never converted from distance gap.
    unit: s
    interaction_group: [gap, time]

  - <<: *pairwise_feature_defaults
    name: distance_gap_entry_m
    definition: Attacker-to-ahead entry distance gap; never converted from time gap.
    unit: m
    interaction_group: [gap, distance]

  - <<: *pairwise_feature_defaults
    name: attacker_speed_entry_mps
    definition: Attacker C1 entry speed converted from km/h to m/s.
    unit: m/s
    interaction_group: [speed, attacker]

  - <<: *pairwise_feature_defaults
    name: defender_speed_entry_mps
    definition: Contemporaneous defender C1 entry speed converted from km/h to m/s.
    unit: m/s
    availability_scope: partial
    interaction_group: [speed, defender]

  - <<: *pairwise_feature_defaults
    name: relative_speed_to_ahead_mps
    definition: Attacker minus defender entry speed; positive means attacker faster.
    unit: m/s
    availability_scope: partial
    interaction_group: [speed, relative]

  - <<: *pairwise_feature_defaults
    name: attacker_acceleration_entry_mps2
    definition: Trailing attacker entry-speed acceleration estimate within the same battle.
    unit: m/s2
    availability_scope: partial
    interaction_group: [acceleration, attacker]

  - <<: *pairwise_feature_defaults
    name: defender_acceleration_entry_mps2
    definition: Trailing defender entry-speed acceleration estimate within the same battle.
    unit: m/s2
    availability_scope: partial
    interaction_group: [acceleration, defender]

  - <<: *pairwise_feature_defaults
    name: relative_acceleration_to_ahead_mps2
    definition: Attacker trailing acceleration minus defender acceleration; positive means attacker accelerates more.
    unit: m/s2
    availability_scope: partial
    interaction_group: [acceleration, relative]

  - <<: *pairwise_feature_defaults
    name: gap_rate_ahead_s_per_s
    definition: Trailing time-gap change per elapsed second; negative means closing.
    unit: s/s
    availability_scope: partial
    interaction_group: [gap, rate]

  - <<: *pairwise_feature_defaults
    name: attacker_braking_intensity
    definition: C1 entry-aligned attacker braking intensity when materialised; no offline segment fraction is used.
    unit: ratio
    availability_scope: partial
    interaction_group: [braking, attacker]

  - <<: *pairwise_feature_defaults
    name: defender_braking_intensity
    definition: C1 entry-aligned defender braking intensity when materialised; no offline segment fraction is used.
    unit: ratio
    availability_scope: partial
    interaction_group: [braking, defender]

  - <<: *pairwise_feature_defaults
    name: braking_intensity_delta
    definition: Attacker minus defender entry braking intensity when both are live-source available.
